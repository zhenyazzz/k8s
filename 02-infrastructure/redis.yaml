apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.5-alpine
          args:
            - redis-server
            - --maxmemory 256mb          
            - --maxmemory-policy allkeys-lru 
            - --appendonly no            
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"   
              cpu: "100m"       
            limits:
              memory: "256Mi"   
              cpu: "500m"       
