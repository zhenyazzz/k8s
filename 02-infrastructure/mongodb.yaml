apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: docker.io/bitnami/mongodb:latest
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  until mongosh --host 127.0.0.1 --port 27017 --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do
                    sleep 2
                  done

                  mongosh --host 127.0.0.1 --port 27017 --quiet <<'EOF'
                  try {
                    rs.status()
                    print("Replica set already initialized")
                  } catch (e) {
                    print("Initializing replica set rs0")
                    rs.initiate({
                      _id: "rs0",
                      members: [{ _id: 0, host: "mongodb-0.mongodb.default.svc.cluster.local:27017" }]
                    })
                  }
                  EOF
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi